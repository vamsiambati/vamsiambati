<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>404 - Not Found</title>
    <style>
      :root {
        color-scheme: light;
      }

      body {
        margin: 0;
        font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
        background: #f6f7fb;
        color: #222;
        display: flex;
        min-height: 100vh;
        align-items: center;
        justify-content: center;
        text-align: center;
        padding: 24px;
      }

      .card {
        background: #fff;
        border-radius: 12px;
        padding: 32px 28px;
        box-shadow: 0 12px 30px rgba(0, 0, 0, 0.08);
        max-width: 420px;
        width: 100%;
      }

      h1 {
        font-size: 2.2rem;
        margin: 0 0 12px;
      }

      p {
        margin: 0 0 24px;
        line-height: 1.5;
      }

      a {
        display: inline-block;
        padding: 10px 18px;
        background: #1a73e8;
        color: #fff;
        border-radius: 8px;
        text-decoration: none;
        font-weight: 600;
      }

      a:hover {
        background: #1558b0;
      }
    </style>
  </head>
  <body>
    <main class="card">
      <h1>Page not found</h1>
      <p>The page you are looking for does not exist.</p>
      <a href="/">Go to homepage</a>
    </main>
  </body>
</html>
